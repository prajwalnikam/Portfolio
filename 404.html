<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The requested page could not be found. Return to Prajwal Nikam's portfolio home.">
    <title>404 - Page Not Found | Prajwal Nikam</title>
    <link rel="canonical" href="https://prajwalnikam.dev/404.html">

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="apple-touch-icon" href="assets/favicon.svg">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#0b1329">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
    <link rel="stylesheet" href="style.css">

    <style>
        .error-page-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
            position: relative;
        }

        .error-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1.5rem;
            padding: 3.5rem 2.5rem;
            max-width: 600px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .error-badge {
            font-size: 5rem;
            font-weight: 900;
            line-height: 1;
            color: var(--primary);
            margin-bottom: 1rem;
            letter-spacing: -2px;
            text-shadow: 0 8px 24px var(--primary-glow);
        }

        .error-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 0.75rem;
            letter-spacing: -0.01em;
        }

        .error-description {
            font-size: 0.975rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .error-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .error-quick-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .error-quick-links a {
            color: var(--primary);
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .error-quick-links a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="error-page-wrapper">
        <main class="error-card">
            <div class="error-badge">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-description">
                The page or resource you are looking for doesn't exist, has been removed, or is temporarily unavailable. Let's get you back on track.
            </p>

            <div class="error-actions">
                <a href="/" class="btn btn-primary">
                    <i class="uil uil-estate"></i>
                    <span>Return to Home</span>
                </a>
                <a href="/#work" class="btn btn-outline">
                    <i class="uil uil-scenery"></i>
                    <span>View Projects</span>
                </a>
            </div>

            <nav class="error-quick-links" aria-label="Quick links">
                <span>Quick Links:</span>
                <a href="/#about">About</a>
                <a href="/#skills">Skills</a>
                <a href="/#journey">Experience</a>
                <a href="/#contact">Contact</a>
            </nav>
        </main>
    </div>
</body>

</html>
